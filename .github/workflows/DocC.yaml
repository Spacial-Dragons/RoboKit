name: DocC Archiving

on:
  push:
    branches: 
      - main

permissions:
  contents: write

jobs:
  test-visionos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
    
      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
    
      - name: Resolve SwiftPM dependencies
        run: swift package resolve
    
      - name: Generate DocC Archive
        run: |
          xcodebuild docbuild \
            -scheme RoboKit \
            -derivedDataPath ${{ github.workspace }}/DerivedData \
            -destination 'platform=visionOS Simulator,name=Apple Vision Pro,OS=2.2' \
            -skipPackagePluginValidation \
            -skipMacroValidation
    
      - name: Process DocC Archive for Static Hosting
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ARCHIVE_PATH=$(find "${{ github.workspace }}/DerivedData" -type d -name "*.doccarchive" | head -n 1)
          echo "Found DocC archive at: $ARCHIVE_PATH"

          OUTPUT_PATH="${{ github.workspace }}/docs"

          xcrun docc process-archive transform-for-static-hosting \
            "$ARCHIVE_PATH" \
            --output-path "$OUTPUT_PATH" \
            --hosting-base-path "$REPO_NAME"

      - name: Deploy to web-deploy branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Create a clean repo copy in a temp dir
          mkdir temp
          cd temp
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin web-deploy
          git checkout -b web-deploy || git checkout web-deploy

          # Clean all contents
          rm -rf *
          cp -r ../docs/* .

          git add .
          git commit -m "Update DocC documentation"
          git push origin web-deploy --force
